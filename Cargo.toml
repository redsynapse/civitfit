[package]
name = "civitfit"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Right-size Civitai image models to your hardware"
license = "MIT"
readme = "README.md"
exclude = ["legacy-python/**"]
keywords = ["civitai", "stable-diffusion", "hardware", "cli", "apple-silicon"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
ureq = "2.12"

[profile.release]
lto = true
codegen-units = 1
# This toolchain ships a broken rust-objcopy (missing libLLVM.dylib), so let
# cargo skip the strip step. Users can still strip the binary themselves.
strip = "none"
